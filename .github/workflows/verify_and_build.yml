name: Verification and Build

on:
  push:
    branches: ["feb-2026"]
    paths:
      - '**.rs'
      - '**/Cargo**'
  pull_request:
    types: ["opened", "reopened", "edited"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/checkout@v4
    - name: Copy Verus action
      uses: actions/checkout@v4
      with:
        repository: loonwerks/INSPECTA-Verus-CI-Action
        path: INSPECTA-Verus-CI-Action
    - name: Verus Analysis
      id : verus
      uses: ./INSPECTA-Verus-CI-Action
      with:
        sourcepath: system/hamr/microkit
    - name: Get analysis timestamp
      run: echo "Analysis timestamp is ${{ steps.verus.outputs.timestamp }}"
    - name: Get analysis status
      run: echo "Analysis status is ${{ steps.verus.outputs.status }}"
    - name: Get analysis status-messages
      run: echo "Analysis status messages are ${{ steps.verus.outputs.status-messages }}"
    - name: Archive analysis results
      uses: actions/upload-artifact@v4
      with:
        name: verus-analysis-report
        path: verus-output.json
        retention-days: 30
    - name: Collect analysis results report
      if: ${{ always() }}
      run: |
        echo ${{ steps.verus.outputs.status-messages }} | jq --raw-input . | jq --slurp '{"messages" : .}' \
          | jq --arg timestamp "${{ steps.verus.outputs.timestamp }}" \
          --arg exitcode ${{ steps.verus.outputs.status }} \
          '. += $ARGS.named' \
          > verus-report.json
    - name: Archive analysis results
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: verus-analysis-report
        path: verus-report.json
        retention-days: 30

  codebuild:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/checkout@v4
    - name: Copy Codebuild action
      uses: actions/checkout@v4
      with:
        repository: loonwerks/INSPECTA-Codebuild-CI-Action
        path: INSPECTA-Codebuild-CI-Action
    - name: Code Build
      id : codebuild
      uses: ./INSPECTA-Codebuild-CI-Action
      with:
        sourcepath: system/hamr/microkit
    - name: Get codebuild timestamp
      run: echo "Codebuild timestamp is ${{ steps.codebuild.outputs.timestamp }}"
    - name: Get codebuild status
      run: echo "Codebuild status is ${{ steps.build.codebuild.outputs.status }}"
    - name: Get codebuild status-messages
      run: echo "Codebuild status messages are ${{ steps.codebuild.outputs.status-messages }}"
    - name: Archive built artifacts
      uses: actions/upload-artifact@v4
      with:
        name: codebuild-built-artifacts
        path: |
          system/hamr/microkit/build/
          system/hamr/microkit/crates/seL4_ArduPilot_ArduPilot/target/
          system/hamr/microkit/crates/seL4_LowLevelEthernetDriver_LowLevelEthernetDriver/target/
          system/hamr/microkit/crates/seL4_RxFirewall_RxFirewall/target/
          system/hamr/microkit/crates/seL4_MavlinkFirewall_MavlinkFirewall/target/
          system/hamr/microkit/crates/seL4_TxFirewall_TxFirewall/target/
          system/hamr/microkit/microkit.system.merged
        retention-days: 30
    - name: Count Lines of Code (cloc)
      if: ${{ always() }}
      uses: djdefi/cloc-action@main
      with:
        options: "--exclude-lang=YAML --json --report-file=cloc-report.json"
    - name: Collect codegen report
      if: ${{ always() }}
      run: |
        cat codebuild.out | jq --raw-input . | jq --slurp '{"messages" : .}' > codebuild-messages.json
        jq '{"cloc" : .}' cloc-report.json > cloc-report-sub.json
        jq -s 'add' codebuild-messages.json cloc-report-sub.json \
          | jq --arg timestamp "$(date)" --arg exitcode ${{ steps.codebuild.outputs.status }} '. += $ARGS.named' \
          > codebuild-report.json
    - name: Archive codebuild results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: codebuild-report
        path: codebuild-output.json
        retention-days: 30

  reports:
    runs-on: ubuntu-latest
    needs: [verify, codebuild]
    continue-on-error: false

    permissions:
      artifact-metadata: read
      contents: write
      packages: read
      attestations: read
      pages: write
      id-token: write

    steps:
    - name: Download logika report artifact
      uses: dawidd6/action-download-artifact@v3 # Use this community action
      with:
        workflow: analysis_and_codegen.yml # The filename of the workflow that uploaded the artifact
        name: logika-analysis-report
        branch: feb-2026 # Specify the branch of the run, if needed
        github_token: ${{ secrets.GITHUB_TOKEN }}
        path: public
    - name: Download codegen report artifact
      uses: dawidd6/action-download-artifact@v3 # Use this community action
      with:
        workflow: analysis_and_codegen.yml # The filename of the workflow that uploaded the artifact
        name: codegen-report
        branch: feb-2026 # Specify the branch of the run, if needed
        github_token: ${{ secrets.GITHUB_TOKEN }}
        path: public
    - name: Download verification report artifact
      uses: actions/download-artifact@v5
      with:
        name: verus-analysis-report
        path: public
    - name: Download codebuild report artifact
      uses: actions/download-artifact@v5
      with:
        name: codebuild-report
        path: public

